name: test

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'docs/adr/**'
      - 'package.json'
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'docs/adr/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
      # adr スクリプトは依存ゼロのため npm ci は不要。
      - run: npm test
